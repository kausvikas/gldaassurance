# CI gates — closes debt item DR-001 ("No CI pipeline").
#
# Authority: TEST_STRATEGY.md §9 — "The build fails on any of: failing test, architecture
# violation, accessibility violation, secret detected, generator validation failure,
# unreviewed golden fixture change."
#
# Four of those six gates cannot exist yet because what they check does not exist yet. They
# are named below rather than omitted, each with the phase that owns it, so that a later phase
# adding an accessibility suite without wiring its gate is a visible gap rather than a quiet one:
#
#   | Gate                             | Owning phase | State                                |
#   |----------------------------------|--------------|--------------------------------------|
#   | Accessibility / contrast         | 6            | DEFERRED — no components exist        |
#   | Token-usage lint (REQ-UX-001)    | 6            | PARTIAL — G-COLOUR gate active, unused|
#   | Generator validation             | 3            | ACTIVE — npm run data:validate         |
#   | Golden fixture change review     | 4            | ACTIVE — report:phase13 exits non-zero |
#   |                                  |              | if a golden-truth figure moves        |
#   | DB-level immutability            | —            | ACTIVE — npm run db:verify (DR-012     |
#   |                                  |              | closed; brings its own container)     |
#   | Trusted runtime contract         | 13           | ACTIVE — npm run server:check          |
#   | Distribution link audit          | 13           | ACTIVE — npm run audit:links           |

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # SECURITY_MODEL.md §7 — "Lockfile committed; no unpinned installs."
      - name: Install (locked)
        run: npm ci

      # ADR-0002 §Verification — the Money type-level assertions are enforced here.
      - name: Typecheck
        run: npm run typecheck

      # ADR-0001 §Verification, TEST_STRATEGY.md §5.
      - name: Architecture gate
        run: npm run check:architecture

      # ADR-0001 §Decision 3, ADR-0007 §Decision 3 — closes DR-007 statically.
      - name: Schema boundary gate
        run: npm run check:schema

      - name: Lint (import boundaries)
        run: npm run lint

      - name: Tests
        run: npm test

      # TEST_STRATEGY.md §6 — generator validation fails the build, not a warning.
      - name: Synthetic data validation
        run: npm run data:validate

      # DR-012 — real PostgreSQL execution. Runs locally via a disposable Docker container; in CI it
      # needs a postgres service, which is why it is not wired into the default `npm run verify`.
      # 80 checks: migration chain from empty, As-Sold immutability, privileges, NUMERIC precision,
      # authored constraints, recognised-revenue correction history, schema boundaries, transaction
      # atomicity, declared indexes.
      - name: PostgreSQL verification (DR-012)
        run: npm run db:verify
        continue-on-error: false

      # ---------------------------------------------------------------------
      # Phase 13 gates.
      #
      # These were being run by hand, which is the same thing as not having them.
      # Every P0 closed in Phase 13 was found by running the product rather than by
      # the suite above, and three of the gates that now catch those regressions
      # lived only in a developer's terminal. A frozen baseline whose regressions
      # CI does not catch is not frozen.
      # ---------------------------------------------------------------------

      # The trusted runtime's transport and access-control contract, against a live
      # socket: anonymous refusal on every route, token forgery, caller isolation,
      # rate limiting, audit lineage, and the honest 503 when no durable store exists.
      # Asserting these against a handler function would prove something about the
      # function; DR-029's obligations are about the server.
      - name: Trusted runtime contract
        run: npm run server:check

      # Re-derives the golden truth and the governed facts from the running system and
      # exits non-zero if a figure has moved. A benchmark written by hand is a claim
      # about a system; this one is a measurement of it.
      - name: Phase 13 evidence and golden truth
        run: npm run report:phase13

      # The distribution the public URL serves, and its internal links. `audit:links`
      # needs the built site, so the build is a step rather than an assumption.
      - name: Build distribution
        run: npm run build:dist

      - name: Link audit
        run: npm run audit:links

      # REQ-SEC-008. Runs after the build so it scans generated output, not only source.
      - name: Secret scan
        run: node scripts/ci/secret-scan.mjs

      # SECURITY_MODEL.md §7 — "vulnerability scan in CI".
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
